<!-- eravos tab: rituals · category: creating -->
<!-- served by api/server.js at GET /api/tabs/rituals -->
<div class="panel" id="panel-rituals">
    <div class="g2">
      <div class="fc gap16">
        <div class="card">
          <div class="card-title">🕯 RITUAL GENERATOR</div>
          <label class="fl">Intention</label>
          <input type="text" id="ritual-intention" placeholder="e.g. new beginning, healing..." style="margin-bottom:10px">
          <label class="fl">Mode</label>
          <select id="ritual-mode" style="margin-bottom:10px">
            <option value="solo">Solo</option>
            <option value="couple">Couple</option>
            <option value="group">Group</option>
          </select>
          <label class="fl">Duration</label>
          <select id="ritual-duration">
            <option value="5">5 min</option>
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="60">1 hour</option>
            <option value="ceremony">Full Ceremony</option>
          </select>
          <button class="btn p mt12" onclick="generateRitual()">✦ Design Ritual</button>
        </div>
        <div class="card">
          <div class="card-title">⏱ RITUAL TIMER</div>
          <div class="text-center" style="padding:16px 0">
            <div id="ritual-timer-display" style="font-family:var(--fm);font-size:2.8rem;color:var(--amber);text-shadow:0 0 18px var(--fire)">00:00</div>
            <div class="flex gap12 mt12 jb" style="max-width:280px;margin:12px auto 0">
              <button class="btn" onclick="startTimer()">▶ Start</button>
              <button class="btn" onclick="pauseTimer()">⏸ Pause</button>
              <button class="btn d" onclick="resetTimer()">⟳ Reset</button>
            </div>
            <div class="mt12"><label class="fl">Minutes</label>
              <input type="number" id="timer-set" value="5" min="1" max="120" style="max-width:90px;text-align:center">
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">🌀 RITUAL GUIDE</div>
        <div id="ritual-output" class="ai-out" style="min-height:340px;font-size:.93rem"><em class="small">Awaiting your intention...</em></div>
        <div class="flex gap8 mt12">
          <button class="btn g" onclick="saveToVault('ritual',getEl('ritual-output'))">💾 Save</button>
          <button class="btn g" onclick="copyEl('ritual-output')">📋 Copy</button>
          <button class="btn g" onclick="sendToCodex('ritual-output','Ritual')">📖 Codex</button>
        </div>
      </div>
    </div>
  </div>
